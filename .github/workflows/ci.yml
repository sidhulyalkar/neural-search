name: CI

on:
  push:
    branches: [main, mvp-stabilization]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify installed dependency graph
        run: python -m pip check

      - name: Smoke-test portable runtime profiles
        run: |
          neural-search doctor --profile demo
          neural-search profile list
          neural-search profile check demo
          neural-search profile check evaluator
          neural-search profile manifest demo --output /tmp/neural-search-demo-manifest.json
          neural-search artifacts releases
          neural-search artifacts verify

      - name: Lint
        run: ruff check neural_search apps/api scripts tests

      - name: Test
        run: pytest -q

      - name: External-user benchmark fixture
        run: |
          neural-search adoption report \
            --events data/eval/adoption_events_demo.jsonl \
            --output /tmp/adoption-report.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Reject critical development dependency vulnerabilities
        run: npm audit --audit-level=critical

  adoption-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Follow documented fresh-clone setup
        run: |
          python -m pip install --upgrade pip
          make setup

      - name: Validate portable profile
        run: neural-search profile check demo

      - name: Run complete portable user journey
        env:
          NEURAL_SEARCH_DEMO_MODE: "1"
          NEURAL_SEARCH_PROFILE: demo
        run: make demo

      - name: Enforce benchmark and report generation
        env:
          NEURAL_SEARCH_DEMO_MODE: "1"
          NEURAL_SEARCH_PROFILE: demo
        run: |
          python -m neural_search.evaluation.run_benchmark
          python -m neural_search.reports
          neural-search adoption report --events data/eval/adoption_events_demo.jsonl
