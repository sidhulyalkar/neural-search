version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-runtime:
        dependency-type: production
        update-types: [minor, patch]
      frontend-tooling:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies, frontend]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-runtime:
        dependency-type: production
        update-types: [minor, patch]
      python-development:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies, python]
